<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#070b18">
<meta name="description" content="PIYDEN — permainan arcade pantas. Tap, kumpul tenaga dan pecahkan rekod!">
<title>PIYDEN — Tap Fast. Beat Your Best.</title>
<style>
:root{--bg:#070b18;--panel:#101a32;--blue:#37b7ff;--cyan:#7cf4ff;--pink:#ff4c78;--text:#f4f8ff;--muted:#9aaccb}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% -10%,#142b56 0,#070b18 55%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{min-height:100svh;display:flex;justify-content:center;padding:18px 14px 24px}
.app{width:min(100%,520px);display:flex;flex-direction:column;gap:14px}
header{text-align:center;padding:8px 0 2px}
.logo{font-size:clamp(38px,11vw,58px);font-weight:1000;letter-spacing:.16em;margin-left:.16em;line-height:1;background:linear-gradient(90deg,#fff 10%,#75eaff 48%,#4a8cff 90%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 30px #37b7ff33}
.tag{color:var(--muted);font-size:11px;letter-spacing:.28em;margin-top:8px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{background:#101a32cc;border:1px solid #27456b;border-radius:15px;padding:11px 8px;text-align:center;box-shadow:0 8px 25px #0003}
.stat small{display:block;color:var(--muted);font-size:10px;letter-spacing:.13em;font-weight:800}
.stat strong{display:block;font-size:24px;margin-top:3px}
.arena{position:relative;height:min(56svh,440px);min-height:300px;overflow:hidden;border:1px solid #2d6090;border-radius:22px;background:linear-gradient(145deg,#0b1730,#080e20 70%);box-shadow:inset 0 0 50px #1b6eb022,0 18px 40px #0005;touch-action:manipulation}
.arena:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#3aa9ff0d 1px,transparent 1px),linear-gradient(90deg,#3aa9ff0d 1px,transparent 1px);background-size:28px 28px;pointer-events:none}
.arena:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at center,#1b8dff12,transparent 65%);pointer-events:none}
#targets{position:absolute;inset:0;z-index:2}
.target{position:absolute;width:58px;height:58px;border:0;border-radius:50%;transform:translate(-50%,-50%);display:grid;place-items:center;font-size:25px;font-weight:900;box-shadow:0 0 0 7px #37b7ff17,0 0 25px currentColor;cursor:pointer;touch-action:manipulation;animation:pop .16s ease-out}
.target.good{background:radial-gradient(circle at 35% 30%,#e8ffff,#56d9ff 35%,#1479ff 80%);color:#fff}
.target.bad{background:radial-gradient(circle at 35% 30%,#ffe5eb,#ff6688 38%,#b81648 85%);color:#fff;box-shadow:0 0 0 7px #ff4c7817,0 0 25px #ff4c78}
@keyframes pop{from{scale:.5;opacity:.3}to{scale:1;opacity:1}}
.overlay{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;background:#050a17b8;backdrop-filter:blur(5px)}
.overlay.hidden{display:none}
.card{max-width:320px}
.card h1{font-size:27px;margin:0 0 8px}
.card p{color:#b5c5e0;line-height:1.5;margin:0 0 18px;font-size:14px}
button.primary{border:0;border-radius:13px;padding:14px 24px;background:linear-gradient(100deg,#39c9ff,#347aff);color:#061225;font-weight:900;font-size:15px;letter-spacing:.04em;box-shadow:0 8px 24px #238cff55;cursor:pointer}
button.primary:active{transform:scale(.98)}
.controls{display:flex;gap:10px}
.controls button{flex:1;border:1px solid #29486e;border-radius:12px;padding:11px;background:#101a32;color:#dcecff;font-weight:700}
.tip{text-align:center;color:#91a7ca;font-size:12px;line-height:1.5;padding:0 12px}
footer{text-align:center;color:#60799f;font-size:10px;letter-spacing:.1em;padding-top:3px}
.float{position:absolute;z-index:3;pointer-events:none;font-weight:1000;font-size:18px;animation:rise .55s ease-out forwards;text-shadow:0 2px 10px #000}
@keyframes rise{to{transform:translateY(-42px);opacity:0}}
@media(min-height:800px){.arena{height:440px}}
</style>
</head>
<body>
<main class="app">
<header><div class="logo">PIYDEN</div><div class="tag">PLAY · TAP · CONQUER</div></header>
<section class="stats" aria-label="Statistik permainan">
 <div class="stat"><small>SKOR</small><strong id="score">0</strong></div>
 <div class="stat"><small>MASA</small><strong id="time">30</strong></div>
 <div class="stat"><small>REKOD</small><strong id="best">0</strong></div>
</section>
<section class="arena" id="arena" aria-label="Kawasan permainan">
 <div id="targets"></div>
 <div class="overlay" id="overlay">
  <div class="card"><h1 id="headline">Sedia untuk PIYDEN?</h1><p id="message">Tap orb biru untuk kumpul mata. Elakkan orb merah. Dapatkan skor tertinggi dalam 30 saat!</p><button class="primary" id="start">MULA MAIN</button></div>
 </div>
</section>
<div class="controls"><button id="sound" type="button">🔊 Bunyi: ON</button><button id="how" type="button">CARA MAIN</button></div>
<p class="tip">🔵 Orb biru = +10 mata &nbsp; · &nbsp; 🔴 Orb merah = −5 mata<br>Permainan percuma. Rekod disimpan pada peranti ini.</p>
<footer>PIYDEN ARCADE · VERSI 1.0</footer>
</main>
<script>
(()=>{
 const $=id=>document.getElementById(id), arena=$('arena'), targets=$('targets'), overlay=$('overlay');
 let score=0,time=30,running=false,timer=null,spawner=null,soundOn=true,audio=null;
 let best=Number(localStorage.getItem('piyden_best')||0); $('best').textContent=best;
 function beep(freq=620,duration=.07){if(!soundOn)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;o.type='sine';g.gain.value=.045;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch(e){}}
 function update(){ $('score').textContent=score; $('time').textContent=time; $('best').textContent=best; }
 function spawn(){
  if(!running)return;
  const b=document.createElement('button'); const bad=Math.random()<.24;
  b.className='target '+(bad?'bad':'good');b.type='button';b.textContent=bad?'✕':'✦';
  const rect=arena.getBoundingClientRect(),size=58;
  b.style.left=(size/2+Math.random()*(rect.width-size))+'px';
  b.style.top=(size/2+Math.random()*(rect.height-size))+'px';
  b.setAttribute('aria-label',bad?'Orb merah, elakkan':'Orb biru, tambah mata');
  b.addEventListener('pointerdown',e=>{
   e.preventDefault();if(!running)return;
   const r=b.getBoundingClientRect(),ar=arena.getBoundingClientRect();
   const f=document.createElement('span');f.className='float';f.textContent=bad?'−5':'+10';f.style.left=(r.left-ar.left+8)+'px';f.style.top=(r.top-ar.top)+'px';f.style.color=bad?'#ff6a8b':'#8af5ff';targets.appendChild(f);setTimeout(()=>f.remove(),600);
   score=Math.max(0,score+(bad?-5:10));beep(bad?180:740);b.remove();update();
  },{once:true});
  targets.appendChild(b);
  setTimeout(()=>b.remove(),1450);
 }
 function end(){
  running=false;clearInterval(timer);clearInterval(spawner);targets.innerHTML='';
  if(score>best){best=score;localStorage.setItem('piyden_best',String(best));}
  $('headline').textContent='MASA TAMAT!';
  $('message').textContent='Skor anda: '+score+'. Rekod terbaik: '+best+'. Cuba lagi untuk pecahkan rekod!';
  $('start').textContent='MAIN LAGI';overlay.classList.remove('hidden');update();beep(420,.18);
 }
 function start(){
  score=0;time=30;running=true;targets.innerHTML='';overlay.classList.add('hidden');update();spawn();spawner=setInterval(spawn,560);
  timer=setInterval(()=>{time--;update();if(time<=0)end()},1000);
 }
 $('start').addEventListener('click',start);
 $('sound').addEventListener('click',()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 Bunyi: ON':'🔇 Bunyi: OFF';});
 $('how').addEventListener('click',()=>{if(running)return;$('headline').textContent='CARA MAIN';$('message').textContent='Anda ada 30 saat. Tap orb biru (+10). Jangan tap orb merah (−5). Skor dan rekod terbaik disimpan pada peranti ini.';$('start').textContent='FAHAM — MULA';overlay.classList.remove('hidden')});
 update();
})();
</script>
</body>
</html>
